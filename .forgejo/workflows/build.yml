
name: Build and push Docker image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: docker
    if: ${{ !startsWith(github.event.head_commit.message, '[NO CI]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq docker.io openssh-client

      - name: Build and push
        env:
          DOCKER_HOST: tcp://172.28.0.4:2375
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.smilt.dev -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          docker build -t git.smilt.dev/smil/edu:latest .
          docker push git.smilt.dev/smil/edu:latest